name: Test, then build and push Docker image

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test132
          # older migrations hardcode the "evesde" schema
          MARIADB_DATABASE: evesde
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        env:
          DB_USER: root
          DB_PASS: test132
        run: mvn -B test -Dspring.datasource.url=jdbc:mariadb://127.0.0.1:3306/evesde

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Java flavor: much smaller image than the full MegaLinter, and has every linter in .mega-linter.yml.
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/java@v10
        env:
          VALIDATE_ALL_CODEBASE: true

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: [test, megalinter]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: blinddreamer/workflows/.github/workflows/docker.yml@main
    with:
      image: blinddreamer/eve-helper-backend:latest
      pull: true
      no-cache: true
    secrets: inherit
