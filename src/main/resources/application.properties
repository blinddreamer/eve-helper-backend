#DB Settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximumPoolSize=100
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=30000
spring.jpa.open-in-view=false
spring.transaction.default-timeout=3600

#FlyWay Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SDE Updater configuration (JSON format from EVE developers)
# Checks version via ESI /status/ endpoint and downloads versioned SDE files
# URL template uses {version} placeholder (e.g., "3118350")
eve.sde.json.download.url.template=https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-{version}-jsonl.zip
eve.sde.temp.dir=temp_sde_downloads
eve.sde.flyway.locations=filesystem:db/sde_migrations
eve.sde.flyway.table=sde_schema_history
eve.sde.tracking.file=data/sde_tracker.properties

# Server settings
server.port=8080
debug=${ENABLE_DEBUG:false}
#Logger
logging.pattern.console={"@timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZZ}","level":"%5p","thread":"[%t]","logger":"%c","message":"%msg"}%n

# Hibernate properties
spring.jpa.hibernate.ddl-auto=validate

# App properties
REACTIONS=${SKIP_REACTIONS:false}
CODE_VERIFIER=ppff1KrHc4uHQAWCrc0pStvwXR0Pqv2Nsx5w_tdRWaY

# Cache Configuration
# Configured via CaffeineCacheConfig.java with different expiration policies:
# - Static SDE Data (blueprints, regions, stations, systemNames): NEVER expires (warmed on startup)
# - Market Data (cacheItemMarketPrice, cacheMarketPrices): 30 minutes
# - Cost Indexes (cacheCostIndexes): 1 hour
# - Calculations (cacheCalculator, cacheBlueprintData): 30 minutes
#
# Static data caches are warmed on startup via CacheWarmingService
# They only clear on: app restart, SDE update, or manual eviction
spring.cache.type=caffeine

# EVE Data Configuration (Phase 1)
eve.featured.stations=60004588,60008494,60011866,60005686,60003760
eve.default.region.id=10000002
eve.default.system.name=Jita
eve.image.base.url=https://images.evetech.net

#feign logs
logging.level.your.package.name=INFO
logging.level.feign=INFO
logging.level.feign.client=INFO

NTFY_SELECTED_ADDRESS= ${NTFY_ADDRESS}
NTFY_SELECTED_TOKEN = ${NTFY_TOKEN}
