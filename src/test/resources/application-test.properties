# Test Database Configuration
# Use H2 in-memory database for tests or configure test MariaDB instance
spring.datasource.url=jdbc:mariadb://localhost:3306/evesde_test?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:test132}
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.connectionTimeout=30000
spring.jpa.open-in-view=false

# Flyway Configuration for Tests
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Logging for tests
logging.level.root=WARN
logging.level.com.example.pandatribe=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Test-specific configurations
REACTIONS=false

# Featured stations for testing
eve.featured.stations=60004588,60008494,60011866,60005686,60003760
eve.default.region.id=10000002
eve.default.system=Jita
eve.default.location.id=60003760

# Mock external API calls in tests
NTFY_SELECTED_ADDRESS=http://localhost:8080/mock-ntfy
NTFY_SELECTED_TOKEN=test-token
